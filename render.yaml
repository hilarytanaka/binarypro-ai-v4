services:
  - type: web
    name: binarypro-ai-v4
    runtime: python
    plan: free
    buildCommand: >-
      python -c "import zipfile; z=zipfile.ZipFile(\"BinaryPro_AI_V4_CLOUD.zip\"); z.extractall(\".deploy\"); z.close()" && pip install -r .deploy/BinaryPro_AI_V4/requirements.txt
    startCommand: >-
      sh -c 'cd .deploy/BinaryPro_AI_V4 && python -c "from app.db import Base,engine,SessionLocal; from app.schema import Tick; from sqlalchemy import func; Base.metadata.create_all(engine); n=SessionLocal().query(func.count(Tick.id)).filter(Tick.symbol=="R_75").scalar() or 0; print(\"R_75 ticks:\",n); SessionLocal().close()" && python scripts/backfill.py --symbol R_75 --count 5000 || true; python scripts/cloud_worker.py >/tmp/binarypro-worker.log 2>&1 & (while true; do python scripts/train_models.py --symbol R_75 --horizon 5 >/tmp/binarypro-train.log 2>&1 || true; sleep 21600; done) & exec uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: binarypro-ai-db
          property: connectionString
      - key: DEFAULT_SYMBOL
        value: R_75
      - key: DEFAULT_HORIZON
        value: "5"
      - key: MIN_SIGNAL_PROBABILITY
        value: "0.70"
      - key: MIN_TRAIN_SAMPLES
        value: "1000"
      - key: MODEL_DIR
        value: /tmp/models
      - key: LIVE_SYMBOLS
        value: R_75
      - key: BOOTSTRAP_TICKS
        value: "5000"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: binarypro-ai-db
    plan: free
