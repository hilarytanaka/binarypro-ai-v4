services:
  - type: web
    name: binarypro-ai-v4
    runtime: python
    plan: free
    buildCommand: >-
      rm -rf .deploy &&
      mkdir -p .deploy &&
      python -c "import zipfile; zipfile.ZipFile('BinaryPro_AI_V4_CLOUD.zip').extractall('.deploy')" &&
      pip install -r .deploy/BinaryPro_AI_V4/requirements.txt
    startCommand: >-
      cd .deploy/BinaryPro_AI_V4 &&
      python -c "from app.db import Base, engine; Base.metadata.create_all(engine)" &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: binarypro-ai-db
          property: connectionString
      - key: DEFAULT_SYMBOL
        value: R_75
      - key: DEFAULT_HORIZON
        value: "5"
      - key: MIN_SIGNAL_PROBABILITY
        value: "0.70"
      - key: MIN_TRAIN_SAMPLES
        value: "1000"
      - key: MODEL_DIR
        value: .deploy/BinaryPro_AI_V4/models
      - key: LIVE_SYMBOLS
        value: R_75
      - key: BOOTSTRAP_TICKS
        value: "5000"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: binarypro-ai-db
    plan: free
